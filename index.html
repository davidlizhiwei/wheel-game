<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运大转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-size: 2.5rem;
        }
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 60px;
        }
        .wheel-segment span {
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
            white-space: nowrap;
            transform-origin: center;
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff6b6b;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 5;
        }
        .spin-btn {
            margin-top: 40px;
            padding: 18px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(238, 90, 90, 0.4);
            transition: all 0.3s ease;
        }
        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(238, 90, 90, 0.5);
        }
        .spin-btn:active {
            transform: translateY(0);
        }
        .spin-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        .result {
            margin-top: 30px;
            padding: 20px 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }
        .result.show {
            opacity: 1;
            transform: translateY(0);
        }
        .result h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .result p {
            color: #333;
            font-size: 1.2rem;
            font-weight: bold;
        }
        @media (max-width: 480px) {
            .wheel-container {
                width: 320px;
                height: 320px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .wheel-segment span {
                font-size: 13px;
                padding-left: 40px;
            }
        }
    </style>
</head>
<body>
    <h1>🎰 幸运大转盘</h1>
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="center-circle">GO</div>
    </div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">开始抽奖</button>
    <div class="result" id="result">
        <h2>🎉 恭喜你！</h2>
        <p id="resultText"></p>
    </div>

    <script>
        const prizes = [
            { name: 'iPhone 16', color: '#ff6b6b' },
            { name: '¥100红包', color: '#4ecdc4' },
            { name: '谢谢参与', color: '#95a5a6' },
            { name: 'AirPods', color: '#f39c12' },
            { name: '¥50红包', color: '#9b59b6' },
            { name: '再来一次', color: '#3498db' },
            { name: 'iPad', color: '#e74c3c' },
            { name: '¥20红包', color: '#2ecc71' }
        ];

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const result = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        let currentRotation = 0;
        let isSpinning = false;

        // 创建转盘扇形
        function createWheel() {
            const segmentAngle = 360 / prizes.length;
            
            prizes.forEach((prize, index) => {
                const segment = document.createElement('div');
                segment.className = 'wheel-segment';
                segment.style.background = prize.color;
                
                const rotation = index * segmentAngle;
                segment.style.transform = `rotate(${rotation}deg) skewY(${90 - segmentAngle}deg)`;
                
                const text = document.createElement('span');
                text.textContent = prize.name;
                text.style.transform = `skewY(${segmentAngle - 90}deg) rotate(${segmentAngle / 2}deg)`;
                segment.appendChild(text);
                wheel.appendChild(segment);
            });
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            result.classList.remove('show');

            const winningIndex = Math.floor(Math.random() * prizes.length);
            const segmentAngle = 360 / prizes.length;
            
            // 修正：让目标扇形中间对准顶部指针
            const targetSegmentMiddle = winningIndex * segmentAngle + segmentAngle / 2;
            const targetRotation = -targetSegmentMiddle;
            
            const spins = 5 + Math.floor(Math.random() * 3);
            const finalRotation = currentRotation + spins * 360 + (targetRotation - (currentRotation % 360));
            
            wheel.style.transform = `rotate(${finalRotation}deg)`;
            currentRotation = finalRotation;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                resultText.textContent = prizes[winningIndex].name;
                result.classList.add('show');
            }, 4000);
        }

        createWheel();
    </script>
</body>
</html>
